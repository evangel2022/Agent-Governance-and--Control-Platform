# Development stack for the Agent governance and control platform.
# No secret material belongs in this file; the application reads secrets from
# Vault at startup (see deploy/compose/vault/bootstrap.sh).
name: gov

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    ports: ["${POSTGRES_PORT}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    secrets: [postgres_password]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["${REDIS_PORT}:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  opa:
    image: openpolicyagent/opa:0.68.0
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policies"]
    ports: ["${OPA_PORT}:8181"]
    volumes:
      - ../policy:/policies:ro
    healthcheck:
      test: ["CMD", "/opa", "eval", "true"]
      interval: 5s
      timeout: 3s
      retries: 20

  vault:
    image: hashicorp/vault:1.17
    cap_add: ["IPC_LOCK"]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    command: ["server", "-dev"]
    ports: ["${VAULT_PORT}:8200"]
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: ["start-dev", "--http-port=8080", "--import-realm"]
    environment:
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports: ["${KEYCLOAK_PORT}:8080"]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000"]
      interval: 10s
      timeout: 5s
      retries: 30

  api:
    build: { context: ../.., dockerfile: apps/api/Dockerfile }
    env_file: [.env]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      opa: { condition: service_healthy }
      vault: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    ports: ["${API_PORT}:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 20

  gateway:
    build: { context: ../.., dockerfile: services/gateway/Dockerfile }
    env_file: [.env]
    depends_on:
      opa: { condition: service_healthy }
      api: { condition: service_healthy }
    ports: ["${GATEWAY_PORT}:9000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:9000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 20

  runner:
    build: { context: ../.., dockerfile: services/runner/Dockerfile }
    env_file: [.env]
    depends_on:
      vault: { condition: service_healthy }
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:size=64m,noexec,nosuid"]

  worker:
    build: { context: ../.., dockerfile: services/worker/Dockerfile }
    env_file: [.env]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0"]
    volumes:
      - ../../apps/web:/app
    ports: ["${WEB_PORT}:5173"]
    depends_on:
      api: { condition: service_healthy }

secrets:
  postgres_password:
    file: ./secrets/postgres_password

volumes:
  pgdata:
  redisdata:
