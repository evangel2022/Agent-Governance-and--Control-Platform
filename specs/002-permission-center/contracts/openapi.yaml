# Permission Center API - path index
#
# There is **one** API contract for this repository:
#   specs/001-agent-governance-platform/contracts/openapi.yaml
#
# Feature 002 declared its own paths in a separate document during design. That
# document has been folded into the platform contract, because two documents
# describing one API is two sources of truth, and they had already begun to
# disagree: `/users` and `/role-assignments` were declared twice with different
# methods, and `User` had two incompatible shapes.
#
# This file is not a contract. It records which paths this feature owns, so a
# reader can trace a task to the surface it changes. The authoritative
# definition, schemas included, lives in the platform contract.

openapi: 3.1.0
info:
  title: Permission Center API - path index
  version: 0.1.0
  description: >
    Index only. The contract itself is
    specs/001-agent-governance-platform/contracts/openapi.yaml.

# Paths this feature added to the platform contract.
paths_owned:
  - /permissions
  - /roles
  - /roles/{role_id}
  - /roles/{role_id}/permissions
  - /roles/{role_id}/permissions/{permission_name}/unbind
  - /agents/{agent_id}/responsibility

# Operations this feature added to paths the platform already declared.
operations_added:
  - path: /users
    method: post
    operationId: createUser
  - path: /users/{user_id}
    method: get
    operationId: getUser
  - path: /users/{user_id}
    method: patch
    operationId: updateUser
  - path: /role-assignments
    method: get
    operationId: listRoleAssignments
  - path: /role-assignments/{assignment_id}/revoke
    method: post
    operationId: revokeRoleAssignment

# Schemas reconciled or added while the two documents were merged.
schemas:
  added:
    - Permission
    - PermissionBinding
    - RoleCreate
    - RoleUpdate
    - Role
    - UserCreate
    - UserUpdate
    - RevokeAssignment
    - ResponsibilityChange
    - AgentResponsibility
  reconciled:
    - name: User
      change: gained external_subject (required) and last_seen_at; roles kept optional
    - name: RoleAssignmentCreate
      change: role_code replaced by role_id, because organisation-created roles carry no code
    - name: RoleAssignment
      change: gained granted_by, revoked_at and revocation_reason
  reused:
    - name: Problem
      note: the RFC 9457 shape the platform already defines; not redeclared here
