[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gov-api"
version = "0.1.0"
description = "Agent governance and control platform control plane"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "python-jose[cryptography]>=3.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "schemathesis>=3.30",
    "testcontainers[postgres,redis]>=4.5",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# `tests/unit` is on the path so the in-memory adapters are importable from any
# test directory, including the security matrix, without each one reaching into a
# sibling directory or duplicating the helpers.
pythonpath = ["src", "tests/unit"]
